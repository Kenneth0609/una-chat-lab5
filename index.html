<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Socket.IO UNA</title>
    <link rel="stylesheet" href="/chat.css">
  </head>
  <body>
    <header class="chat-header"><h1>UNA Chat</h1><p id="identity" aria-live="polite">Cargando tu sesión…</p><a id="logout" href="/auth/logout">Cerrar sesión</a></header>
    <ul id="messages"></ul>
    <!-- avisos para el visitante (los usan las reglas de public/validators/) -->
    <div id="aviso" role="alert"></div>
    <form action="">
      <input id="nombre" aria-label="Username" autocomplete="off" placeholder="Username" readonly/>
      <input id="m" aria-label="Escriba un mensaje" autocomplete="off" placeholder="Escriba un mensaje" /><button disabled>Send</button>
    </form>
    <!-- el servidor de Socket.IO entrega su propio cliente: no se depende de CDNs externos -->
    <script src="/api/chat/socket.io/socket.io.js"></script>
    <script src="/chat.js"></script>
    <!-- reglas de envio: el servidor concatena public/validators/*.js -->
    <script src="/validators.js"></script>
  </body>
</html>
